[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-earth"
version = "0.1.0"
description = "Autonomous Earth-System Prediction Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "QUANTUM EARTH" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.0",
  "typer>=0.12",
  "rich>=13",
  "python-dateutil>=2.9",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
quantum-earth = "quantum_earth.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantum_earth*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: hits live external data APIs"]
filterwarnings = ["ignore::DeprecationWarning"]
